project:
  type: "website"
  title: "Análisis Avanzado de Datos II 2026"
  output-dir: _output
render:
    - "index.qmd"
    - "2026/*.qmd"
    - "2026/weeks/**/*.qmd"

website:
  title: "Análisis Avanzado de Datos II 2026"
  page-navigation: true
  reader-mode: true
  open-graph: true
  twitter-card:
    creator: "@GSotomayorL"
    site: "@GSotomayorL"
  favicon: "figures/icons/course_favicon.png"
  search:
    location: navbar
    type: textbox
  sidebar:
      style: docked
      collapse-level: 2 # 1️⃣ Abre automáticamente hasta el 2do nivel del menú
      contents:
        - href: 2026/index.qmd
          text: "🏠 Inicio"
        - href: 2026/syllabus.qmd
          text: "📓 Programa"
        # - href: 2026/communication.qmd
        #   text: "📟 Communication"
        # - href: 2026/assignments.qmd
        #   text: "✍️ Assignments"
        #   contents:
        #     - href: 2026/assignments/assignment01.qmd
        #       text: "📝 Assignment 01"
        #     - href: 2026/assignments/assignment02.qmd
        #       text: "📝 Assignment 02"
        #     - href: 2026/assignments/group_project.qmd
        #       text: "👥 Group Project"
        - section: "🗓️ Semanas"
          collapse: false # 2️⃣ Obliga a la sección "Semanas" a estar siempre abierta
          contents:
            - section: "Clase 0 (Nivelación)"
              collapse: false
              contents:
                - href: 2026/weeks/week00/page.qmd
                  text: "👨‍🏫 Material de clase"
                - href: 2026/weeks/week00/lab.qmd
                  text: "💻 Práctico 0"
            - section: "Semana 01"
              collapse: false
              contents:
                - href: 2026/weeks/week01/page.qmd
                  text: "👨‍🏫 Material de clase"
                - href: 2026/weeks/week01/lab.qmd
                  text: "💻 Práctico"
            - section: "Semana 02"
              collapse: true
              contents:
                - href: 2026/weeks/week02/page.qmd
                  text: "👨‍🏫 Material de clase"
                - href: 2026/weeks/week02/lab.qmd
                  text: "💻 Práctico"

  navbar:
    background: primary
  page-footer:
    background: light
    left: "© 2026 [Universidad Diego Portales](https://sociologia.udp.cl/) — SOC9035 Análisis Avanzado de Datos II"
    right: "Desarrollado con [Quarto](https://quarto.org/)"



bibliography: references/references.bib
csl: references/chicago-author-date.csl


format:
  html:
    author:    Gabriel Sotomayor
    author-meta: Gabriel Sotomayor
    date-format: "DD MMMM YYYY"

    email-obfuscation: javascript
    link-external-newwindow: true
    link-external-icon: true
    link-external-filter: ^(?:http:|https:)\/\/(?:gabrielsotomayorl\.github\.io\/|localhost)

    theme:
      light: 
        - journal
        - css/custom.scss # I use this just to change the default colour
    toc: true
    margin-header: |
      ![](/figures/logos/MY_INSTITUTION.png)


